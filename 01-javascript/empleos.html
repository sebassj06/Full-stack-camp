<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Empleos</title>

    <script type="module" src="main.js" defer></script>
  </head>

  <body>
    <header>
      <h1>
        <svg
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
        DevJobs
      </h1>

      <div>
        <devjobs-avatar
          service="x"
          username="SeleVinotinto"
          size="40"
        ></devjobs-avatar>
        <!-- <a href="">Iniciar sesión</a> -->
      </div>
    </header>

    <main>
      <section class="job-search">
        <img src="background.webp" width="200" />
        <h1>Encuentra tu proximo trabajo</h1>
        <p>Explora miles de oportunidades en el sector tecnologico</p>

        <form role="search">
          <div class="search-bar">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="icon icon-tabler icons-tabler-outline icon-tabler-search"
            >
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
              <path d="M21 21l-6 -6" />
            </svg>

            <input
              id="search-bar"
              require
              type="text"
              placeholder="Buscar trabajos, empresas o habilidades"
            />
          </div>

          <div class="search-filters">
            <select name="technology" id="filter-technology">
              <option value="">Tecnología</option>
              <option value="javascript">JavaScript</option>
              <option value="python">Python</option>
              <option value="java">Java</option>
              <option value="react">React</option>
              <option value="nodejs">Node.js</option>
            </select>

            <select name="location" id="filter-location">
              <option value="">Ubicación</option>
              <option value="remoto">Remoto</option>
              <option value="cdmx">Ciudad de México</option>
              <option value="guadalajara">Guadalajara</option>
              <option value="monterrey">Monterrey</option>
              <option value="barcelona">Barcelona</option>
            </select>

            <select name="experience" id="filter-experience">
              <option value="">Nivel de experiencia</option>
              <option value="trainee">Trainee</option>
              <option value="junior">Junior</option>
              <option value="semi-senior">Semi-Senior</option>
              <option value="senior">Senior</option>
              <option value="lead">Tech Lead</option>
            </select>
            <button id="btn-restablecer">Restablecer filtros</button>
          </div>
        </form>
        <span id="filter-selected-value"></span>
      </section>

      <!-- Seccion de Trabajos -->
      <section class="jobs-section">
        <div class="jobs-listings"></div>
        <ul class="page-list">
          <button id="btn-anterior" class="btn-pages"><-</button
          ><button class="btn-pages btn-numero" data-value="1">1</button
          ><button class="btn-pages btn-numero" data-value="2">2</button
          ><button class="btn-pages btn-numero" data-value="3">3</button
          ><button class="btn-pages btn-numero" data-value="4">4</button
          ><button class="btn-pages btn-numero" data-value="5">5</button
          ><button id="btn-siguiente" class="btn-pages">-></button>
        </ul>
      </section>
    </main>

    <footer>
      <small>&copy; 2025 DevJobs. Todos los derechos reservados.</small>
    </footer>
  </body>
</html>
