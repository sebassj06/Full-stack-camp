name: Setup-pnpm for CI/CD
description: "Setup Node.js and pnpm for CI/CD workflows"

inputs:
  node-version:
    description: "Node.js version to install"
    required: true
    default: "22"
  pnmp-version:
    description: "pnpm version to install"
    required: true
    default: "11"

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnmp-version }}
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      shell: bash
      working-directory: 09-ci-cd # Asegura que ejecute en la carpeta correcta
      run: pnpm install --frozen-lockfile --ignore-scripts
