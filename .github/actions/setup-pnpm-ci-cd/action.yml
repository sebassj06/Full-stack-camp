name: Setup-pnpm for CI/CD
description: "Setup Node.js and pnpm for CI/CD workflows"

inputs:
  node-version:
    description: "Node.js version to install"
    required: true
    default: "22"
  pnmp-version:
    description: "pnpm version to install"
    required: true
    default: "11"

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnmp-version }}
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Allow build scripts & Install dependencies
      shell: bash
      # pnpm config set ignore-scripts true (o false según si necesitas que compilen)
      run: |
        pnpm config set only-built-dependencies '@google/genai' 'protobufjs'
        pnpm install --frozen-lockfile
