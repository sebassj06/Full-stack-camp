name: 01 - Hello World

on:
  push:
    branches: [main]

jobs:
  hello:
    runs-on: ubuntu-24.04
    steps:
      - name: Saludar
        run: echo 'Hola desde Github Actions!'

      - name: Ver fecha del runner
        run: date

      - name: Ver archivos disponibles
        run: ls -la

  repo-files:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar codigo del repo
        uses: actions/checkout@v6

      - name: Ver archivos disponibles
        run: ls -la
