name: 05 - ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: Preparar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false

      - name: Instalar dependencias
        run: |
          cd 09-ci-cd
          pnpm install --config.ignore-scripts=true

      - name: Lanzar test
        working-directory: ./09-ci-cd/backend
        run: |
          pnpm run test
